[project]
name = "windiskcleaner"
version = "0.1.1"
description = "Portable Windows disk space analyzer with safe, explained cleanup advice."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PySide6-Essentials>=6.7"]

[project.gui-scripts]
windiskcleaner = "windiskcleaner.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windiskcleaner"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# These files are mostly user-facing prose in two languages.
"src/windiskcleaner/strings.py" = ["E501"]
"src/windiskcleaner/rules.py" = ["E501"]
"src/windiskcleaner/advisor.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
